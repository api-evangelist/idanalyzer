apis:
- aid: idanalyzer:biometric-api
  name: ID Analyzer Biometric API
  description: >-
    REST API for 1:1 face matching between an identity document photo and a live selfie or uploaded image.
    Includes passive liveness detection to prevent spoofing with photos, videos, or masks, and deepfake
    detection capabilities.
  humanURL: https://developer.idanalyzer.com
  baseURL: https://api2.idanalyzer.com
  tags:
  - Biometrics
  - Face Matching
  - Liveness Detection
  - Deepfake Detection
